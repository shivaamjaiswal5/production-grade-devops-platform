apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: production-devops
  labels:
    app: backend
    project: production-devops

spec:
  replicas: 2

  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: backend
      project: production-devops

  template:
    metadata:
      labels:
        app: backend
        project: production-devops

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: backend
          image: devops-backend:v2
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3