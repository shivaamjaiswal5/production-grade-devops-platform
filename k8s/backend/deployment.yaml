apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: devops-backend:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 5000