apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig

metadata:
  name: production-email-config
  namespace: monitoring

spec:
  route:
    receiver: email-notifications
    groupBy:
      - alertname
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 1h

  receivers:
    - name: email-notifications
      emailConfigs:
        - to: wolfcrew3240@gmail.com
          from: shivaamjaiswal5@gmail.com
          smarthost: smtp.gmail.com:587
          authUsername: shivaamjaiswal5@gmail.com
          authPassword:
            name: alertmanager-email-secret
            key: smtp-password
          requireTLS: true