apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: production-devops
  labels:
    app: frontend
    project: production-devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend
      project: production-devops

  template:
    metadata:
      labels:
        app: frontend
        project: production-devops

    spec:
      containers:
        - name: frontend
          image: production-grade-devops-platform-frontend:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80