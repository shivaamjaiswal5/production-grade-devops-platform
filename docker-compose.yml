version: "3.9"

services:

  backend:
    build:
      context: ./app/backend
    container_name: devops-backend
    ports:
      - "5000:5000"
    env_file:
      - ./app/backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
    container_name: devops-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped